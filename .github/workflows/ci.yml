name: CI

on:
  push:
    paths:
      - "detections/**"
      - "scripts/**"
      - "terraform/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "detections/**"
      - "scripts/**"
      - "terraform/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Synthetic detection and safety tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -v

      - name: Evaluate synthetic detection fixtures
        run: python scripts/validate_fixtures.py

  terraform:
    name: Terraform format, validate, and Checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize without a backend
        working-directory: terraform/environments/lab
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: terraform/environments/lab
        run: terraform validate -no-color

      - name: Set up Python for Checkov
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.3.19

      - name: Scan Terraform with Checkov
        run: >-
          checkov
          --directory terraform
          --framework terraform
          --download-external-modules false
          --hard-fail-on HIGH,CRITICAL
          --soft-fail-on LOW,MEDIUM
          --compact
